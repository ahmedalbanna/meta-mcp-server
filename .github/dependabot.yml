version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    reviewers: [anomalyco]
    # Security audit via pip-audit in CI; dependabot covers pip updates
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: [docker, dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [ci, dependencies]
