repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-setuptools]

  - repo: local
    hooks:
      - id: count-tools
        name: count-tools
        entry: python scripts/count_tools.py
        language: system
        pass_filenames: false
        always_run: true
      - id: generate-docs
        name: generate-docs
        entry: python scripts/generate_docs.py
        language: system
        pass_filenames: false
        always_run: true
      # validate-config is info-only in pre-commit (needs .env); CI runs it separately
      - id: validate-config
        name: validate-config
        entry: bash -c 'python scripts/validate_config.py || true'
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]

# pip-audit via local hook (requires pip-audit installed)
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (0 CVEs)
        entry: pip-audit --desc --requirement requirements.txt --requirement requirements-dev.txt
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]
