[project]
name = "meta-mcp-server"
version = "1.1.0"
description = "Meta Marketing MCP Server — 185 tools for Facebook/Instagram/WhatsApp advertising"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "facebook", "instagram", "whatsapp", "ads", "marketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]==1.29.0",
    "facebook-business==26.0.0",
    "python-dotenv==1.2.2",
    "openpyxl==3.1.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-requests",
]
sheets = [
    "gspread==6.2.1",
    "google-auth==2.35.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastMCP pattern)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/throttle.py" = ["E402"]
"src/events.py" = ["RUF002"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "facebook_business.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
