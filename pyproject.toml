[project]
name = "meta-mcp-server"
version = "2.0.0"
description = "Meta Marketing MCP Server — 250 tools for Facebook/Instagram/WhatsApp advertising"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "facebook", "instagram", "whatsapp", "ads", "marketing", "mcp-server", "claude"]
authors = [{ name = "Meta MCP Contributors", email = "maintainers@example.com" }]
maintainers = [{ name = "Meta MCP Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Framework :: FastAPI",
]
dependencies = [
    "mcp[cli]==1.29.0",
    "facebook-business>=26.0.0,<28.0.0",  # 27.0.0 prepared for Graph v27 (latest PyPI 26.0.0 as of 2026-09-18)
    "python-dotenv==1.2.3",
    "openpyxl==3.1.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

[project.urls]
Homepage = "https://github.com/ahmedalbanna/meta-mcp-server"
Repository = "https://github.com/ahmedalbanna/meta-mcp-server"
Issues = "https://github.com/ahmedalbanna/meta-mcp-server/issues"
Documentation = "https://ahmedalbanna.github.io/meta-mcp-server"

[project.scripts]
meta-mcp-server = "server:main"
meta-mcp = "src.cli:main"
meta-webhook = "webhook_server:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-requests",
    "pip-audit==2.7.3",
    "pre-commit==4.0.1",
]
sheets = [
    "gspread==6.2.1",
    "google-auth==2.35.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.41",
    "mkdocs-autorefs==1.2.0",
    "mike==2.1.3",
]
ai = [
    "openai==1.40.0",
    "anthropic==0.40.0",
]
scheduler = [
    "apscheduler==3.10.4",
    "sqlalchemy==2.0.30",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastMCP pattern)
    "SIM108", # ternary operator (readability preference)
    "E402",   # import not at top (per-module resources added dynamically)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/events.py" = ["RUF002", "F401"]
"src/automation.py" = ["F401"]
"src/breakdowns.py" = ["F401"]
"src/business.py" = ["F401"]
"src/creatives.py" = ["F401"]
"src/discovery.py" = ["F401"]
"src/insights.py" = ["F401", "SIM105"]
"src/metrics.py" = ["F401"]
"src/helpers.py" = ["SIM102"]
"src/scheduler.py" = ["SIM105"]
"tests/test_competitor_catalog.py" = ["RUF001"]
"src/content_tools.py" = ["RUF001", "F401"]
"src/services/content_tools_service.py" = ["RUF001"]
"src/llm.py" = ["UP007"]
"scripts/*" = ["RUF001", "B007", "E701", "UP038", "I001"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "facebook_business.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
