[project]
name = "meta-mcp-server"
version = "1.4.0"
description = "Meta Marketing MCP Server — 199 tools for Facebook/Instagram/WhatsApp advertising"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "facebook", "instagram", "whatsapp", "ads", "marketing", "mcp-server", "claude"]
authors = [{ name = "Meta MCP Contributors", email = "maintainers@example.com" }]
maintainers = [{ name = "Meta MCP Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Framework :: FastAPI",
]
dependencies = [
    "mcp[cli]==1.29.0",
    "facebook-business==26.0.0",
    "python-dotenv==1.2.2",
    "openpyxl==3.1.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

[project.urls]
Homepage = "https://github.com/anomalyco/opencode-meta-mcp"
Repository = "https://github.com/anomalyco/opencode-meta-mcp"
Issues = "https://github.com/anomalyco/opencode-meta-mcp/issues"
Documentation = "https://anomalyco.github.io/opencode-meta-mcp"

[project.scripts]
meta-mcp-server = "server:main"
meta-webhook = "webhook_server:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-requests",
]
sheets = [
    "gspread==6.2.1",
    "google-auth==2.35.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.41",
    "mkdocs-autorefs==1.2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastMCP pattern)
    "SIM108", # ternary operator (readability preference)
    "E402",   # import not at top (per-module resources added dynamically)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/events.py" = ["RUF002", "F401"]
"src/automation.py" = ["F401"]
"src/breakdowns.py" = ["F401"]
"src/business.py" = ["F401"]
"src/creatives.py" = ["F401"]
"src/discovery.py" = ["F401"]
"src/insights.py" = ["F401"]
"src/metrics.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "facebook_business.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
