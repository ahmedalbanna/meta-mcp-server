site_name: Meta MCP Server
site_description: Meta Marketing MCP Server — 201 tools for Facebook/Instagram/WhatsApp
site_url: https://ahmedalbanna.github.io/meta-mcp-server
repo_url: https://github.com/ahmedalbanna/meta-mcp-server
# Versioning via mike (Phase 9.3) — deploy with `mike deploy 2.0 latest --update-aliases`
extra:
  version:
    provider: mike
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tools Reference: tools.md
  - Webhooks: webhooks.md
  - Metrics & Dashboard: metrics.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
